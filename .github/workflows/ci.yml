name: CI

on:
  push:
    branches: [main, v2-fullstack]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sap
          POSTGRES_USER: sap_admin
          POSTGRES_PASSWORD: ci-admin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sap_admin -d sap" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check app tests scripts
      - name: Create least-privilege app role
        if: matrix.db == 'postgres'
        env:
          PGPASSWORD: ci-admin
        run: |
          psql -h localhost -U sap_admin -d sap -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE sap_app LOGIN PASSWORD 'ci-app' NOSUPERUSER NOBYPASSRLS;
          GRANT USAGE, CREATE ON SCHEMA public TO sap_app;
          SQL
      - name: Tests
        env:
          SAP_TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+asyncpg://sap_app:ci-app@localhost:5432/sap' || '' }}
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run build
