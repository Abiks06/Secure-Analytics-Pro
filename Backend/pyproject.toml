[project]
name = "secure-analytics-backend"
version = "2.0.0"
description = "Secure Analytics Pro API: encrypted ingestion, automated cleaning, profiling, PII governance and insight generation."
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "anthropic>=1.17.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "charset-normalizer>=3.5.2",
    "cryptography>=50.0.2",
    "duckdb>=2.0.0",
    "fastapi>=0.157.0",
    "fastexcel>=0.21.0",
    "numpy>=2.5.4",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.5",
    "sse-starlette>=3.5.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM105", "SIM108"]
