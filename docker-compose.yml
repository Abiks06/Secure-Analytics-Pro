# Runs the analytics engine + web app as one container against your Supabase project.
#
#   cp .env.example .env    # fill in the values (see README)
#   docker compose up --build
#
# Database, auth and encrypted file storage are all provided by Supabase.

services:
  app:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${SAP_SUPABASE_URL:?set SAP_SUPABASE_URL in .env}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${SAP_SUPABASE_PUBLISHABLE_KEY:?set SAP_SUPABASE_PUBLISHABLE_KEY in .env}
    environment:
      SAP_DATABASE_URL: ${SAP_DATABASE_URL:?set SAP_DATABASE_URL in .env}
      SAP_SUPABASE_URL: ${SAP_SUPABASE_URL}
      SAP_SUPABASE_PUBLISHABLE_KEY: ${SAP_SUPABASE_PUBLISHABLE_KEY}
      SAP_MASTER_KEY: ${SAP_MASTER_KEY:?set SAP_MASTER_KEY in .env}
      SAP_CORS_ORIGINS: ${SAP_PUBLIC_ORIGIN:-http://localhost:8000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - appdata:/data

volumes:
  appdata:
